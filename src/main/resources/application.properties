# ============================================================
# application.properties
# - 무엇: Spring Boot 서버의 기본 설정 파일
# - 역할: 서버 포트, DB 접속 정보, JPA·Flyway 동작 방식을 정한다.
# - 누가: 서버를 실행하는 Spring Boot가 시작할 때 자동으로 읽는다.
#
# 비밀값(비밀번호 등)은 여기에 직접 쓰지 않는다.
# ${DB_PASSWORD} 처럼 적으면 Spring이 시작할 때 환경 변수나 .env에서 값을 찾아 채운다.
# ============================================================

spring.application.name=bank-open-api

# ---------- .env 읽기 ----------
# Spring Boot는 원래 .env 파일을 읽지 않는다.
# 아래 설정으로 "실행한 폴더의 .env 파일을 properties 형식 설정 파일로 함께 읽어라"라고 알려 준다.
#   - optional:  .env가 없어도 에러 없이 넘어간다. (OS 환경 변수만으로도 실행 가능하게)
#   - file:.env  현재 작업 폴더(보통 프로젝트 루트)의 .env 파일
#   - [.properties]  .env 파일 확장자를 모르니 "properties 형식으로 읽어라"라는 힌트
# 우선순위: OS 환경 변수 > .env 값  (같은 이름이 둘 다 있으면 OS 환경 변수가 이긴다)
spring.config.import=optional:file:.env[.properties]

# ---------- 서버 ----------
# bank_core가 8080을 쓰므로 이 서버는 8081을 쓴다.
server.port=8081

# ---------- DB 접속 (docker-compose.yml 의 MySQL) ----------
# localhost:3308 = docker-compose.yml 에서 열어 둔 호스트 포트 (3307은 bank_core가 사용 중)
# serverTimezone: 날짜·시간을 한국 시간 기준으로 주고받는다.
spring.datasource.url=jdbc:mysql://localhost:3308/bank_open_api?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
# validate: JPA가 테이블을 만들거나 고치지 않는다.
#   서버가 시작할 때 "엔티티(@Entity) 구조와 실제 테이블이 맞는지"만 검사하고,
#   다르면 서버가 시작되지 않는다.
#   → 테이블은 오직 Flyway 마이그레이션(SQL 파일)으로만 만든다.
spring.jpa.hibernate.ddl-auto=validate
# Open Session In View 끄기: DB 연결을 요청이 끝날 때까지 붙잡지 않게 한다. (API 서버에서 권장)
spring.jpa.open-in-view=false

# ---------- JWT (로그인 출입증) ----------
# 서명용 비밀 키: .env 또는 OS 환경 변수 JWT_SECRET에서 읽는다. (여기에 직접 쓰지 않는다)
#   - HS256 방식은 32바이트 이상이 필요하다. 짧으면 서버가 시작할 때 오류를 내고 멈춘다. (SecurityConfig)
#   - 값이 아예 없으면 "Could not resolve placeholder 'JWT_SECRET'" 오류로 서버가 시작되지 않는다.
jwt.secret=${JWT_SECRET}
# 토큰 유효 시간 (분). 60분 = 1시간
jwt.expiration-minutes=60

# ---------- bank_core 연동 (계좌 조회 전달) ----------
# bank_core 주소. 값이 없으면 기본값 http://localhost:8080 (콜론 뒤가 기본값)
bank-core.base-url=${BANK_CORE_BASE_URL:http://localhost:8080}
# bank_core에 로그인할 "연동 전용 회원" 계정 (.env 또는 OS 환경 변수에서 읽는다. 여기에 직접 쓰지 않는다)
#   값이 비어 있어도 서버는 켜진다 (개발자 포털은 bank_core 없이도 쓸 수 있게).
#   대신 /open/v1/accounts 호출 시 502 BANK_CORE_UNAVAILABLE + 에러 로그("연동 계정 설정 없음")가 나온다.
bank-core.username=${BANK_CORE_USERNAME:}
bank-core.password=${BANK_CORE_PASSWORD:}
# 연결 제한 시간 / 응답 제한 시간 (넘으면 504 BANK_CORE_TIMEOUT)
bank-core.connect-timeout=3s
bank-core.read-timeout=5s

# ---------- Flyway ----------
# 서버가 시작할 때 아래 폴더의 SQL 파일(V1__xxx.sql, V2__xxx.sql ...)을 순서대로 실행해 테이블을 만든다.
# 이미 실행한 파일은 flyway_schema_history 테이블에 기록되어 다시 실행되지 않는다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Redis (오픈 API 호출 제한용 토큰 양동이 저장소) ──
# docker-compose.yml의 bank-open-api-redis 컨테이너 (127.0.0.1:6380). 로컬 전용이라 비밀번호 없음
# localhost 대신 127.0.0.1: 컨테이너가 IPv4 127.0.0.1에만 열려 있으므로 IPv6(::1)로 가는 일이 없게 고정
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6380
# 명령 제한 시간: Redis가 느리거나 멈춰도 요청이 0.5초 넘게 붙잡히지 않게 짧게 둔다
# (시간이 넘으면 RateLimitFilter가 호출 제한 없이 통과시킨다 = fail-open)
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# ── 호출 제한 (토큰 버킷, 앱(appId)마다 양동이 1개) ──
# capacity: 양동이 크기 = 한 번에 몰아서 보낼 수 있는 최대 요청 수
# refill-per-second: 1초에 다시 채워지는 토큰 수 (소수 가능. 예: 0.5 = 2초에 1개)
# → 지금 값: 최대 10개까지 몰아서 보낼 수 있고, 평균적으로는 초당 1번
rate-limit.capacity=10
rate-limit.refill-per-second=1

# ── 오픈 API 사용량 기록 (비동기 저장) ──
# pool-size: DB 저장을 맡는 전용 스레드 수
# queue-capacity: 저장을 기다릴 수 있는 기록 수. 꽉 차면 새 기록은 버리고 WARN 로그 (API 응답에는 영향 없음)
usage-log.pool-size=2
usage-log.queue-capacity=1000
