# ============================================================
# [무엇] 스프링 테스트 프레임워크 설정 (테스트 classpath에서만 읽힘)
# [역할] 테스트 환경(ApplicationContext) 캐시를 최대 4개까지만 살려 둔다.
#        스프링은 설정이 다른 테스트 환경을 기본 32개까지 닫지 않고 재사용하는데,
#        우리 테스트 환경마다 MySQL·Redis 컨테이너가 하나씩 떠 있어서 환경이 많아지면
#        Docker 메모리(약 4GB)를 넘어 MySQL이 OOM으로 강제 종료됐다 (3주차 3단계에서 18개 실패).
#        4개를 넘으면 가장 오래 안 쓴 환경을 닫고 → 그 컨테이너도 같이 멈춘다 → 동시에 떠 있는 MySQL이 최대 4~5개.
# [누가 쓰나] ./gradlew test 의 모든 스프링 테스트
# ============================================================
spring.test.context.cache.maxSize=4
