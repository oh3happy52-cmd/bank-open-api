# ============================================================
# [무엇] 테스트 전용 설정 (src/main/resources/application.properties 값 위에 덮어씀)
# [역할] classpath:/config/application.properties는 classpath:/application.properties보다 우선한다.
#        이 파일은 테스트 실행 때만 classpath에 있으므로 서버 실행(bootRun)에는 영향이 없다.
# [누가 쓰나] ./gradlew test 의 모든 스프링 테스트
# ============================================================

# 웹훅 비밀키 암호화 키: 테스트 전용 고정값 (진짜 키 아님. 32바이트 = "test-only-webhook-encryption-key"를 Base64로)
webhook.encryption-key=dGVzdC1vbmx5LXdlYmhvb2stZW5jcnlwdGlvbi1rZXk=

# 발송 일꾼 스케줄러는 끈다 → 다른 테스트에 영향 없음.
# 웹훅 테스트는 WebhookDispatcher.dispatchDue()를 직접 불러 "언제 보내는지"를 정확히 정한다
webhook.dispatch.enabled=false

# 모의 핀테크 서버는 기본으로 끈다 (필요한 테스트만 mock-fintech.enabled=true로 켬)
mock-fintech.enabled=false
