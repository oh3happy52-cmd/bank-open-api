// [무엇] Gradle 빌드 설정
// [역할] Java 21, Spring Boot 4.1.3, 사용하는 라이브러리 목록과 테스트·실행 옵션(한국 시간 고정)을 정함
// [누가 쓰나] ./gradlew test, ./gradlew bootRun, IntelliJ가 읽음

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// 인증·권한: Spring Security(문지기)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// JWT 만들기·검사 기능 (bank_core와 같은 방식: Spring Security의 OAuth2 Resource Server + Nimbus)
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	// Redis 접속(Lettuce 클라이언트 + StringRedisTemplate): 오픈 API 호출 제한(Rate Limit)의 토큰 양동이 저장소
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	// 인증·권한 테스트: MockMvc 요청이 문지기(Spring Security)를 거치게 해 줌
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	// 비동기 저장이 끝날 때까지 "조건이 맞을 때까지 기다리기" (Thread.sleep 대신)
	testImplementation 'org.awaitility:awaitility'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// 테스트용 Java를 처음부터 한국 시간으로 시작 (컴퓨터가 UTC여도 DB 연결과 앱의 날짜 기준이 같아짐)
	jvmArgs '-Duser.timezone=Asia/Seoul'
	// 테스트 중에 찍힌 로그(로그인 실패 원인 등)를 화면에 보여 줌
	testLogging {
		showStandardStreams = true
	}
}

tasks.named('bootRun') {
	// 서버용 Java도 처음부터 한국 시간으로 시작
	jvmArgs '-Duser.timezone=Asia/Seoul'
}
